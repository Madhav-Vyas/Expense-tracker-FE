<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Emerald Accent Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Subtle Container Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.1" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#10B981" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Green Rounded Square Base -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />
  
  <!-- Subtle Inner Container Highlight -->
  <rect x="48" y="48" width="416" height="416" rx="80" fill="none" stroke="#10B981" stroke-opacity="0.08" stroke-width="2" />

  <!-- Main Logo Mark Group -->
  <g filter="url(#glow)">
    <!-- Outer Roof Structure -->
    <path d="M 140 250 L 256 150 L 372 250 L 372 370 C 372 381 363 390 352 390 L 160 390 C 149 390 140 381 140 370 Z" 
          fill="none" 
          stroke="url(#greenGrad)" 
          stroke-width="28" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Coin / Currency Base -->
    <circle cx="256" cy="335" r="38" 
            fill="#064E3B" 
            stroke="url(#greenGrad)" 
            stroke-width="14" />
    
    <text x="256" y="347" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="34" 
          font-weight="800" 
          fill="#34D399" 
          text-anchor="middle">$</text>

    <!-- Dynamic Upward Growth Arrow -->
    <path d="M 155 350 L 235 270 L 285 310 L 370 190" 
          fill="none" 
          stroke="url(#cyanGrad)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Arrowhead -->
    <path d="M 325 190 L 375 190 L 375 240" 
          fill="none" 
          stroke="url(#cyanGrad)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
